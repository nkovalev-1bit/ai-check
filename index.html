<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Готова ли 1С к ИИ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, one question per screen; Первый Бит dark style: navy ground, turquoise and pink accents */
:root {
  --bg: #0B1722;
  --surface: #112231;
  --surface-2: #16293A;
  --ink: #F2F6F8;
  --muted: #93A3B0;
  --line: #223647;
  --accent: #3AD2BA;
  --accent-ink: #06141C;
  --accent-soft: #123B3D;
  --pink: #F0419A;
  --warn: #F0B050;
  --warn-soft: #3A2F1E;
  --low: #F0419A;
  --low-soft: #3B1A31;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; padding-block: 28px 48px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.15; font-weight: 700; }
h2 { font-size: clamp(20px, 4.6vw, 24px); line-height: 1.25; font-weight: 500; }
h3 { font-size: 16px; line-height: 1.3; font-weight: 500; }
p { margin: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 600; }
.lead { color: var(--muted); max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.block { display: flex; flex-direction: column; gap: 10px; }
.label { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: left;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.btn {
  font: inherit; font-weight: 600; font-size: 16px; border: 0; border-radius: 12px; cursor: pointer;
  padding: 14px 20px; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-block;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 10px 14px; font-size: 14px; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { font-size: 14px; color: var(--muted); }

.progress { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.qmeta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  font: inherit; text-align: left; cursor: pointer; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.option:hover { border-color: var(--accent); }
.option[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.example { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score b { font-family: var(--font-display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--pink); }
.qmeta b { color: var(--pink); font-family: var(--font-display); font-weight: 500; }
.score span { color: var(--muted); }
.level { display: inline-block; font-weight: 600; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
.score .lv-low { background: var(--low-soft); color: var(--pink); }
.score .lv-mid { background: var(--warn-soft); color: var(--warn); }
.score .lv-high { background: var(--accent); color: var(--accent-ink); }
.dims { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.dim { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 14px; }
.dim .bar { height: 8px; }
.dim em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.section { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.t-good { background: var(--accent-soft); color: var(--accent); }
.t-mid { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--low-soft); color: var(--low); }
.recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.recs li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 15px; }
.recs li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.recs li.ok::before { background: var(--accent); }
.recs li.mid::before { background: var(--warn); }
.recs li.bad::before { background: var(--low); }
.recs b { font-weight: 600; }
.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.list li { max-width: 62ch; }
.list li::marker { color: var(--pink); font-family: var(--font-display); font-weight: 500; }
.list li { padding-left: 4px; }
.card { padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.field input {
  font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); width: 100%;
}
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.contacts { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.sel { user-select: all; }
.status { font-size: 13px; color: var(--accent); min-height: 1.2em; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 4px; }
/* goose */
.goose { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px 16px 0; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.goose-art { position: relative; width: 132px; aspect-ratio: 2 / 3; max-width: 100%; cursor: pointer; border: 0; padding: 0; background: none; transform-origin: 50% 100%; }
.pose { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .25s ease;
  -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }
.pose.on { opacity: 1; }
.goose { overflow: hidden; }
.bubble { align-self: center; margin-bottom: 12px; position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 26px; width: 12px; height: 12px; background: var(--surface-2); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble b { font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.bubble span { color: var(--muted); font-size: 14px; }
.meme { font-style: normal; font-weight: 600; font-size: 14px; color: var(--ink); margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.g-high .bubble b { color: var(--accent); }
.g-mid .bubble b { color: var(--warn); }
.g-low .bubble b { color: var(--pink); }
.spark { position: absolute; width: 10px; height: 10px; background: var(--accent); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; }
.spark.s1 { top: 6%; left: -6px; } .spark.s2 { top: 22%; right: -8px; width: 14px; height: 14px; background: var(--pink); } .spark.s3 { top: -6px; left: 45%; }
@keyframes idle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-1deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.04, .94); } 40% { transform: translateY(-18px) scale(.97, 1.04); } 65% { transform: translateY(0) scale(1.03, .96); } }
@keyframes think { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-5deg); } 70% { transform: rotate(3deg); } }
@keyframes shake { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-6deg); } 30% { transform: rotate(5deg); } 45% { transform: rotate(-4deg); } 60% { transform: rotate(3deg); } 75% { transform: rotate(-1deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
.goose-art { animation: idle 3.2s ease-in-out infinite; }
.g-high .goose-art.react { animation: hop .7s ease-out 3, idle 3.2s ease-in-out 2.1s infinite; }
.g-mid .goose-art.react { animation: think 2.4s ease-in-out 2, idle 3.2s ease-in-out 4.8s infinite; }
.g-low .goose-art.react { animation: shake .9s ease-in-out 2, idle 3.2s ease-in-out 1.8s infinite; }
.g-high .spark { animation: twinkle 1.6s ease-in-out infinite; } .g-high .spark.s2 { animation-delay: .5s; } .g-high .spark.s3 { animation-delay: 1s; }
@media (max-width: 420px) { .goose { grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 12px 12px 0; } .goose-art { width: 104px; } }
@media (prefers-reduced-motion: reduce) { .pose { transition: none; } .goose-art, .goose-art.react, .spark { animation: none !important; } .g-high .spark { opacity: 1; } }
@media (max-width: 420px) { .dim { grid-template-columns: 84px minmax(0, 1fr) 40px; } }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>
</head>
<body>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function () {
  const ROLES = [
    { id: "owner", name: "Собственник или генеральный директор", short: "Собственник / ГД" },
    { id: "fin", name: "Финансовый директор или главный бухгалтер", short: "Финансы" },
    { id: "it", name: "ИТ-директор или руководитель 1С", short: "ИТ" },
    { id: "line", name: "Руководитель направления (продажи, производство, снабжение, логистика)", short: "Руководитель направления" }
  ];
  const INDUSTRIES = [
    { id: "stroy", name: "Стройка и девелопмент" },
    { id: "prod", name: "Производство" },
    { id: "trade", name: "Торговля и дистрибуция" },
    { id: "log", name: "Транспорт и логистика" },
    { id: "hold", name: "Холдинг, услуги" },
    { id: "other", name: "Другое" }
  ];
  const DIMS = { sys: "Система", data: "Данные", proc: "Процессы", org: "Команда" };

  // Option: [answer text, points 0..3, recommendation for this answer]
  const COMMON = [
    { id: "c1", dim: "sys", text: "На какой 1С у вас основной учёт?",
      opts: [
        ["1С:ERP, 1С:КА, 1С:УХ или отраслевая ERP на их основе", 3, "С такой конфигурацией работать проще всего. ИИ подключается к стандартным объектам, переделывать почти ничего не придётся."],
        ["1С:Управление торговлей, Бухгалтерия, ЗУП отдельными программами", 2, "Подойдёт. Только данные лежат в разных программах, поэтому начать лучше с той, где больше всего нужной вам информации."],
        ["1С:УПП или другая старая конфигурация", 1, "УПП уже не развивается, и подключать к ней ИИ сложнее. Попробовать можно, но я бы обсуждал это вместе с переходом на 1С:ERP."],
        ["Учёт не только в 1С, есть другие системы и Excel", 0, "Сейчас часть учёта живёт вне 1С, и ИИ увидит только её кусок. Сначала стоит решить, какая система отвечает за какой участок."]
      ] },
    { id: "c2", dim: "sys", text: "Сколько у вас баз 1С и как они связаны?",
      opts: [
        ["Одна основная база", 3, "С одной базой проще всего, все ответы берутся из одного места."],
        ["Несколько баз с настроенными обменами", 2, "Раз обмены настроены, можно подключить ИИ к главной базе, а остальные добавить потом."],
        ["Несколько баз, данные сводим вручную", 1, "Если данные сводятся руками, общий ответ ИИ не соберёт. Начните с одной базы и одного участка."],
        ["Много разрозненных баз по юрлицам и площадкам", 0, "Когда баз много и они не связаны, сначала нужна простая схема: где какие данные и кто за них отвечает. Без неё пилот расползётся."]
      ] },
    { id: "c3", dim: "data", text: "В каком состоянии справочники: номенклатура, контрагенты, договоры?",
      ex: {
        stroy: "Например, один и тот же бетон М300 заведён три раза под разными названиями.",
        prod: "Например, одна деталь в нескольких карточках с разными артикулами.",
        trade: "Например, один клиент заведён дважды, с ИНН и без.",
        log: "Например, одна машина записана разными госномерами или в разных форматах.",
        hold: "Например, один контрагент заведён в каждом юрлице по-своему.",
        other: "Например, один контрагент или товар заведён несколько раз."
      },
      opts: [
        ["Порядок, есть ответственный за справочники", 3, "Отлично. От справочников больше всего зависит, насколько точно ИИ будет отвечать."],
        ["В целом нормально, дубли встречаются", 2, "Пара дублей начать не помешает. Перед пилотом только почистите справочники на том участке, с которого начнёте."],
        ["Дублей много, все об этом знают", 1, "Из-за дублей ИИ будет ошибаться. Спросите, сколько на складе бетона, а он заведён тремя позициями, и ответ получится неполным. Я бы начинал с чистки справочников."],
        ["Каждый заводит как хочет", 0, "Пока каждый заводит по-своему, точных ответов не будет. Нужен ответственный и несколько простых правил. Обычно это несколько недель работы, и польза видна сразу, даже без ИИ."]
      ] },
    { id: "c4", dim: "data", text: "Насколько вовремя данные попадают в 1С?",
      ex: {
        stroy: "Например, прораб списывает материалы в день работ или раз в месяц пачкой.",
        prod: "Например, выпуск отражается по сменам или в конце месяца.",
        trade: "Например, отгрузки проводятся сразу или копятся.",
        log: "Например, путевые листы закрываются после рейса или в конце месяца.",
        hold: "Например, первичка из юрлиц приходит вовремя или к закрытию периода.",
        other: "Например, документы вносятся сразу или раз в месяц."
      },
      opts: [
        ["В день события или сразу", 3, "Раз данные вносятся сразу, ИИ сможет отвечать на текущие вопросы: что на складе, где заказ, кто должен."],
        ["С задержкой в несколько дней", 2, "Для анализа этого хватит. На вопросы про сегодняшний день ответы будут немного отставать, это стоит учесть."],
        ["Раз в месяц, к закрытию периода", 1, "Когда всё вносится к закрытию месяца, ИИ поможет разбирать прошлые периоды, но не текущую ситуацию."],
        ["Часть операций живёт в Excel или на бумаге", 0, "То, что живёт в Excel и на бумаге, ИИ не увидит. Сначала это надо перенести в 1С, например через мобильный ввод с объекта или склада."]
      ] },
    { id: "c5", dim: "data", text: "Как у вас готовятся управленческие отчёты?",
      opts: [
        ["Формируются в 1С или BI, руками почти не правим", 3, "Хорошо, ИИ будет опираться на те же цифры, которым вы уже доверяете."],
        ["Выгружаем из 1С и дособираем в Excel", 2, "Часть расчётов живёт в Excel. Перед пилотом запишите, как считаются главные показатели, иначе ответы ИИ могут не совпасть с привычными цифрами."],
        ["Отдельный человек собирает их по несколько дней", 1, "Отчёты, которые собираются вручную, хорошо отдавать на автоматизацию. Но сначала нужно договориться, как именно считается каждая цифра."],
        ["Регулярной отчётности по сути нет", 0, "Пока нет общих показателей, непонятно, какой ответ считать правильным. Я бы начал с короткого списка цифр, которые руководству нужны каждую неделю."]
      ] },
    { id: "c6", dim: "proc", text: "Описаны ли процессы и правила работы в 1С?",
      opts: [
        ["Да, есть регламенты, их соблюдают", 3, "Когда все работают по одним правилам, одинаковые операции оформлены одинаково, и ИИ их правильно понимает."],
        ["Частично, для основных участков", 2, "Для пилота берите описанный участок, остальные можно подтянуть по ходу."],
        ["Знания в головах ключевых сотрудников", 1, "Если правила только в головах, документы оформляют кто как привык. Для пилота лучше выбрать участок, где работают один-два человека с понятной практикой."],
        ["Нет", 0, "Без описанных процессов трудно проверить, правильно ли отвечает ИИ. Хотя бы для одного участка правила стоит записать до старта."]
      ] },
    { id: "c7", dim: "org", text: "Можно ли по правилам безопасности использовать ИИ с данными из 1С?",
      opts: [
        ["Да, если данные не уходят за пределы РФ", 3, "Тогда можно работать с российской облачной моделью и запустить пилот быстро."],
        ["Только если модель работает на наших серверах", 2, "Так тоже можно, модель ставится на ваши серверы. Это дольше и нужны мощности, обсудим на старте."],
        ["Не обсуждали", 1, "Этот вопрос лучше закрыть до пилота: где работает модель, что ей доступно и как сохраняются права из 1С. Обычно хватает одной встречи со службой безопасности."],
        ["Сейчас запрещено", 0, "Пока запрет действует, можно навести порядок в данных и описать задачи. Когда правила пересмотрят, всё будет готово."]
      ] }
  ];

  const BY_ROLE = {
    owner: [
      { id: "o1", dim: "proc", text: "Как вы сейчас получаете главные цифры: деньги, долги, продажи?",
        opts: [
          ["Смотрю сам в отчёте или на дашборде", 3, "Вы уже смотрите цифры сами. ИИ добавит возможность задать уточняющий вопрос, не открывая новый отчёт."],

  const CONTACT = { name: "Николай Ковалев", company: "Первый Бит", phone: "+7 925 005-14-25", wa: "79250051425", tg: "KovalevNic", email: "niakovalev@1cbit.ru" };

  const state = { step: "intro", role: null, industry: null, i: 0, answers: {}, person: "", firm: "" };
  const app = document.getElementById("app");

  function questions() { return state.role ? COMMON.concat(BY_ROLE[state.role]) : COMMON; }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function nameOf(list, id) { const f = list.find(x => x.id === id); return f ? f.name : ""; }

  function footer() {
    return `<footer>
      <span>Опросник подготовил ${esc(CONTACT.name)}, ${esc(CONTACT.company)}.</span>
      <span>Ответы никуда не отправляются, пока вы сами не решите поделиться результатом.</span>
    </footer>`;
  }

  function renderIntro() {
    const ready = state.role && state.industry;
    app.innerHTML = `
      <span class="eyebrow">Экспресс-проверка · 1С и ИИ</span>
      <h1>Готова ли ваша 1С к ИИ</h1>
      <p class="lead">Десять вопросов о том, как у вас устроены 1С, данные и процессы. Часть вопросов зависит от вашей роли. В конце увидите оценку по каждому блоку, разбор ваших ответов и задачи, с которых имеет смысл начать.</p>
      <div class="facts"><span class="fact">3 минуты</span><span class="fact">10 вопросов</span><span class="fact">результат сразу</span></div>
      <div class="block">
        <span class="label" id="role-l">Ваша роль</span>
        <div class="chips" role="group" aria-labelledby="role-l">
          ${ROLES.map(r => `<button type="button" class="chip" id="role-${r.id}" data-role="${r.id}" aria-pressed="${state.role === r.id}">${esc(r.name)}</button>`).join("")}
        </div>
      </div>
      <div class="block">
        <span class="label" id="ind-l">Отрасль компании</span>
        <div class="chips" role="group" aria-labelledby="ind-l">
          ${INDUSTRIES.map(r => `<button type="button" class="chip" id="ind-${r.id}" data-ind="${r.id}" aria-pressed="${state.industry === r.id}">${esc(r.name)}</button>`).join("")}
        </div>
      </div>
      <div class="row">
        <button type="button" class="btn" id="start" ${ready ? "" : "disabled"}>Начать</button>
        ${ready ? "" : `<span class="hint">Выберите роль и отрасль</span>`}
      </div>
      ${footer()}`;
    app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
      if (state.role !== b.dataset.role) { state.answers = {}; }
      state.role = b.dataset.role; renderIntro();
    });
    app.querySelectorAll("[data-ind]").forEach(b => b.onclick = () => { state.industry = b.dataset.ind; renderIntro(); });
    app.querySelector("#start").onclick = () => { if (ready) { state.step = "q"; state.i = 0; render(); } };
  }

  function renderQuestion() {
    const qs = questions();
    const q = qs[state.i];
    const ex = q.ex ? q.ex[state.industry] : null;
    app.innerHTML = `
      <div class="progress">
        <div class="qmeta"><span>${DIMS[q.dim]}</span><span><b>${state.i + 1}</b> из ${qs.length}</span></div>
        <div class="bar" aria-hidden="true"><span style="width:${(state.i / qs.length) * 100}%"></span></div>
      </div>
      <h2>${esc(q.text)}</h2>
      ${ex ? `<p class="example">${esc(ex)}</p>` : ""}
      <div class="options" role="group">
        ${q.opts.map((o, k) => `<button type="button" class="option" id="${q.id}-o${k}" data-k="${k}" aria-pressed="${state.answers[q.id] === k}">${esc(o[0])}</button>`).join("")}
      </div>
      <div class="row"><button type="button" class="btn ghost small" id="back">Назад</button></div>`;
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      state.answers[q.id] = Number(b.dataset.k);
      if (state.i < qs.length - 1) state.i++; else state.step = "result";
      render();
    });
    app.querySelector("#back").onclick = () => { if (state.i === 0) state.step = "intro"; else state.i--; render(); };
  }

  function grade(p) { return p >= 0.67 ? "good" : p >= 0.34 ? "mid" : "bad"; }

  function compute() {
    const qs = questions();
    const dims = {};
    Object.keys(DIMS).forEach(d => dims[d] = { got: 0, max: 0, items: [] });
    let total = 0;
    qs.forEach(q => {
      const k = state.answers[q.id];
      const o = q.opts[k] || q.opts[q.opts.length - 1];
      total += o[1];
      dims[q.dim].got += o[1];
      dims[q.dim].max += 3;
      dims[q.dim].items.push({ q, o });
    });
    const max = qs.length * 3;
    const share = total / max;
    const lvl = share >= 0.73 ? "high" : share >= 0.43 ? "mid" : "low";
    const LV = {
      high: ["Можно запускать", "lv-high", "Система и данные в хорошем состоянии. Можно подключать ИИ и проверять его на настоящих вопросах сотрудников."],
      mid: ["Можно пробовать", "lv-mid", "Начать можно, но с одной или двух понятных задач. Параллельно стоит поправить то, что отмечено ниже."],
      low: ["Пока рано", "lv-low", "Если подключить ИИ к учёту в нынешнем виде, он будет часто ошибаться. Сначала стоит навести порядок, и это даст пользу даже без ИИ."]
    };
    return { total, max, dims, lvl, level: LV[lvl][0], cls: LV[lvl][1], summary: LV[lvl][2] };
  }

  function messageText(r) {
    const who = [state.person, state.firm].filter(Boolean).join(", ");
    return `Николай, добрый день! Прошёл проверку «Готова ли 1С к ИИ».\n` +
      (who ? `${who}\n` : "") +
      `Роль: ${nameOf(ROLES, state.role)}\nОтрасль: ${nameOf(INDUSTRIES, state.industry)}\n` +
      `Результат: ${r.total} из ${r.max} (${r.level})\n` +
      Object.keys(DIMS).filter(d => r.dims[d].max).map(d => `${DIMS[d]}: ${r.dims[d].got}/${r.dims[d].max}`).join(", ") +
      `\nХочу обсудить результат.`;
  }

  function gooseBlock(r, ordered) {
    const weak = ordered[0], strong = ordered[ordered.length - 1];
    const SAY = {
      high: ["Ого, да вы готовы!", `Можно запускать хоть завтра. Сильнее всего у вас блок «${DIMS[strong]}».`],
      mid: ["Неплохо, неплохо.", `Начинать уже можно. Больше всего вопросов к блоку «${DIMS[weak]}», разбор ниже.`],
      low: ["Хм, пока рановато.", `Давайте сначала наведём порядок, особенно в блоке «${DIMS[weak]}». А потом зовите меня.`]
    };
    const t = SAY[r.lvl];
    return `<div class="goose g-${r.lvl}">
      <button type="button" class="goose-art" id="goose" aria-label="Гусь реагирует на результат, нажмите ещё раз">
        <img class="pose pose-idle on" src="${GOOSE.idle}" alt="" width="300" height="450">
        <img class="pose pose-react" src="${GOOSE[{high: "happy", mid: "think", low: "doubt"}[r.lvl]]}" alt="Гусь PIX" width="300" height="450">
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
      </button>
      <div class="bubble"><b>${esc(t[0])}</b><span>${esc(t[1])}</span><em class="meme" id="meme"></em></div>
    </div>`;
  }

  function renderResult() {
    const r = compute();
    const scen = (START[state.industry] || START.other)[state.role];
    const dimKeys = Object.keys(DIMS).filter(d => r.dims[d].max);
    // weakest blocks first so the reader sees what matters
    const ordered = dimKeys.slice().sort((a, b) => r.dims[a].got / r.dims[a].max - r.dims[b].got / r.dims[b].max);
    const TAG = { good: ["Всё хорошо", "t-good"], mid: ["Есть вопросы", "t-mid"], bad: ["Нужно поправить", "t-bad"] };
    const DOT = p => p === 3 ? "ok" : p === 2 ? "mid" : "bad";

    app.innerHTML = `
      <span class="eyebrow">Результат · ${esc(nameOf(INDUSTRIES, state.industry))} · ${esc(ROLES.find(x => x.id === state.role).short)}</span>
      <div class="score"><b>${r.total}</b><span>из ${r.max}</span><span class="level ${r.cls}">${r.level}</span></div>
      ${gooseBlock(r, ordered)}
      <p class="lead">${r.summary}</p>
      <div class="dims">
        ${dimKeys.map(d => {
          const p = Math.round((r.dims[d].got / r.dims[d].max) * 100);
          return `<div class="dim"><span>${DIMS[d]}</span><div class="bar"><span style="width:${p}%"></span></div><em>${r.dims[d].got}/${r.dims[d].max}</em></div>`;
        }).join("")}
      </div>
      <div class="block">
        <h2>Разбор по вашим ответам</h2>
        ${ordered.map(d => {
          const g = grade(r.dims[d].got / r.dims[d].max);
          return `<div class="section">
            <div class="section-head"><h3>${DIMS[d]}</h3><span class="tag ${TAG[g][1]}">${TAG[g][0]}</span></div>
            <p class="hint">${DIM_SUMMARY[d][g]}</p>
            <ul class="recs">${r.dims[d].items.map(it => `<li class="${DOT(it.o[1])}"><span><b>${esc(it.o[0])}.</b> ${esc(it.o[2])}</span></li>`).join("")}</ul>
          </div>`;
        }).join("")}
      </div>
      <div class="block">
        <h2>С каких задач начать</h2>
        <p class="lead">${esc(ROLE_NOTE[state.role])}${r.dims.data.max && grade(r.dims.data.got / r.dims.data.max) === "bad" ? " Раз с данными пока сложно, начинайте с участка, где порядок лучше всего." : ""}</p>
        <ol class="list">${scen.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      </div>
      <div class="block">
        <h2>Следующий шаг</h2>
        <p>${esc(NEXT[r.lvl][state.role])}</p>
      </div>
      <div class="card">
        <h2>Разобрать результат вместе</h2>
        <p class="hint">Созвонимся на 30 минут: посмотрим ваши ответы, выберем одну задачу для пилота и прикинем сроки.</p>
        <div class="fields">
          <label class="field" for="f-person">Имя<input id="f-person" autocomplete="name" value="${esc(state.person)}"></label>
          <label class="field" for="f-firm">Компания<input id="f-firm" autocomplete="organization" value="${esc(state.firm)}"></label>
        </div>
        <div class="row">
          <a class="btn small" id="wa" target="_blank" rel="noopener">Отправить в WhatsApp</a>
          <a class="btn small" id="tg" target="_blank" rel="noopener" href="https://t.me/${CONTACT.tg}">Открыть Telegram</a>
          <button type="button" class="btn ghost small" id="copy">Скопировать результат</button>
        </div>
        <p class="status" id="status"></p>
        <div class="contacts">
          <span><b>${esc(CONTACT.name)}</b>, ${esc(CONTACT.company)}</span>
          <span>Телефон, WhatsApp, Telegram: <span class="sel">${esc(CONTACT.phone)}</span></span>
          <span>Почта: <span class="sel">${esc(CONTACT.email)}</span></span>
        </div>
      </div>
      <div class="row"><button type="button" class="btn ghost small" id="again">Пройти заново</button></div>
      ${footer()}`;

    const goose = app.querySelector("#goose");
    const idleImg = goose.querySelector(".pose-idle"), reactImg = goose.querySelector(".pose-react");
    const memeEl = app.querySelector("#meme");
    const memePool = MEMES[r.lvl].concat(r.lvl === "high" ? [] : [MEMES.weak[ordered[0]]]);
    let lastMeme = -1;
    const nextMeme = () => {
      let k = Math.floor(Math.random() * memePool.length);
      if (k === lastMeme && memePool.length > 1) k = (k + 1) % memePool.length;
      lastMeme = k; memeEl.textContent = memePool[k];
    };
    const react = () => {
      nextMeme();
      goose.classList.remove("react"); idleImg.classList.add("on"); reactImg.classList.remove("on");
      setTimeout(() => { void goose.offsetWidth; idleImg.classList.remove("on"); reactImg.classList.add("on"); goose.classList.add("react"); }, 700);
    };
    goose.onclick = react;
    react();
    const wa = app.querySelector("#wa");
    const setWa = () => { wa.href = `https://wa.me/${CONTACT.wa}?text=${encodeURIComponent(messageText(r))}`; };
    setWa();
    app.querySelector("#f-person").oninput = e => { state.person = e.target.value.trim(); setWa(); };
    app.querySelector("#f-firm").oninput = e => { state.firm = e.target.value.trim(); setWa(); };
    const status = app.querySelector("#status");
    app.querySelector("#tg").addEventListener("click", () => copy(messageText(r), "Текст скопирован. Вставьте его в чат Telegram."));
    app.querySelector("#copy").onclick = () => copy(messageText(r), "Скопировано.");
    app.querySelector("#again").onclick = () => { state.answers = {}; state.i = 0; state.step = "intro"; render(); };

    function copy(text, ok) {
      const done = () => { status.textContent = ok; };
      const fallback = () => {
        const t = document.createElement("textarea");
        t.value = text; t.setAttribute("readonly", ""); t.style.position = "absolute"; t.style.left = "-9999px";
        document.body.appendChild(t); t.select();
        try { document.execCommand("copy"); done(); } catch (e) { status.textContent = "Не получилось скопировать автоматически."; }
        t.remove();
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      } catch (e) { fallback(); }
    }
  }

  function render() {
    if (state.step === "intro") renderIntro();
    else if (state.step === "q") renderQuestion();
    else renderResult();
    window.scrollTo(0, 0);
  }
  render();
})();
</script>
</body>
</html>
